  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <!-- Lucide Icons CDN -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- React & ReactDOM CDN -->

  <style>
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #eef4ff;
      background-image:
        radial-gradient(#93c5fd 1.35px, transparent 1.35px),
        radial-gradient(#fde047 1.35px, #eef4ff 1.35px);
      background-size: 48px 48px;
      background-position: 0 0, 24px 24px;
    }

    h1, h2, h3, .font-black, .font-extrabold {
      font-family: 'Fredoka', 'Plus Jakarta Sans', sans-serif;
      letter-spacing: 0.015em;
    }

    /* Efek Kartu & Panel Ala Game 3D */
    .rounded-3xl {
      border-radius: 1.6rem !important;
      box-shadow: 0 8px 0 rgba(30, 58, 138, 0.12), 0 12px 24px -4px rgba(15, 23, 42, 0.08) !important;
      border-width: 2px !important;
    }

    .rounded-2xl {
      border-radius: 1.15rem !important;
    }

    /* Efek Tombol Game 3D (Tactile Arcade Button) */
    button, label.cursor-pointer {
      transition: transform 0.12s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.12s ease, filter 0.15s ease !important;
    }

    button:hover:not(:disabled), label.cursor-pointer:hover {
      transform: translateY(-2px);
      filter: brightness(1.04);
    }

    button:active:not(:disabled), label.cursor-pointer:active {
      transform: translateY(3px) !important;
    }

    /* Tombol Warna Spesifik dengan Bevel 3D Bawah */
    button.bg-blue-600 {
      background: linear-gradient(180deg, #3b82f6 0%, #2563eb 100%) !important;
      box-shadow: 0 5px 0 #1e40af, 0 8px 15px rgba(37, 99, 235, 0.25) !important;
      border: 2px solid #60a5fa !important;
    }
    button.bg-blue-600:active:not(:disabled) {
      box-shadow: 0 1px 0 #1e40af !important;
    }

    button.bg-amber-400 {
      background: linear-gradient(180deg, #facc15 0%, #f59e0b 100%) !important;
      box-shadow: 0 5px 0 #b45309, 0 8px 15px rgba(245, 158, 11, 0.3) !important;
      border: 2px solid #fef08a !important;
    }
    button.bg-amber-400:active:not(:disabled) {
      box-shadow: 0 1px 0 #b45309 !important;
    }

    button.bg-emerald-600, button.bg-emerald-500 {
      background: linear-gradient(180deg, #10b981 0%, #059669 100%) !important;
      box-shadow: 0 5px 0 #065f46, 0 8px 15px rgba(16, 185, 129, 0.28) !important;
      border: 2px solid #6ee7b7 !important;
    }
    button.bg-emerald-600:active:not(:disabled), button.bg-emerald-500:active:not(:disabled) {
      box-shadow: 0 1px 0 #065f46 !important;
    }

    button.bg-rose-600 {
      background: linear-gradient(180deg, #f43f5e 0%, #e11d48 100%) !important;
      box-shadow: 0 5px 0 #9f1239, 0 8px 15px rgba(225, 29, 72, 0.28) !important;
      border: 2px solid #fda4af !important;
    }
    button.bg-rose-600:active:not(:disabled) {
      box-shadow: 0 1px 0 #9f1239 !important;
    }

    button.bg-slate-900, button.bg-slate-800 {
      background: linear-gradient(180deg, #334155 0%, #0f172a 100%) !important;
      box-shadow: 0 5px 0 #020617 !important;
      border: 2px solid #475569 !important;
    }

    /* Animasi Maskot Game Melayang */
    @keyframes floatGame {
      0%, 100% { transform: translateY(0px) rotate(0deg); }
      50% { transform: translateY(-8px) rotate(1.5deg); }
    }
    .game-float {
      animation: floatGame 3.8s ease-in-out infinite;
    }

    /* Custom scrollbar ala Game */
    ::-webkit-scrollbar {
      width: 8px;
      height: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #dbeafe;
      border-radius: 9999px;
    }
    ::-webkit-scrollbar-thumb {
      background: #3b82f6;
      border-radius: 9999px;
      border: 2px solid #dbeafe;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #1d4ed8;
    }
  </style>
</head>

        const b64 = document.getElementById('game-b64').textContent.replace(/\s+/g, '');
        return new TextDecoder().decode(Uint8Array.from(atob(b64), (c) => c.charCodeAt(0)));
      }, []);

      useEffect(() => { saveLS('classes', classes); }, [classes]);
      useEffect(() => { saveLS('questions', questions); }, [questions]);
      useEffect(() => { saveLS('games', games); }, [games]);
      useEffect(() => {
        const onStorage = (e) => {
          if (!e.key || !e.key.startsWith('sipintar:')) return;
          try {
            const v = JSON.parse(e.newValue || 'null');
            if (v === null) return;
            if (e.key === 'sipintar:results') setResults(v);
            if (e.key === 'sipintar:games') setGames(v);
            if (e.key === 'sipintar:questions') setQuestions(v);
            if (e.key === 'sipintar:classes') setClasses(v);
          } catch (err) {}
        };
        const onHash = () => { setSiswaMode(/^#siswa/.test(window.location.hash)); setRoomParam(roomFromHash(window.location.hash)); };
        window.addEventListener('storage', onStorage);
        window.addEventListener('hashchange', onHash);
        return () => { window.removeEventListener('storage', onStorage); window.removeEventListener('hashchange', onHash); };
      }, []);

      // Soal permainan = soal yang dipilih guru (atau soal semapel untuk permainan contoh)
      const getGameQuestions = (g) => {
        const ids = g.questionIds;
        let list = ids && ids.length
          ? ids.map((id) => questions.find((q) => q.id === id)).filter(Boolean)
          : questions.filter((q) => q.subject === g.subject);
        if (!list.length) list = questions;
        return list.filter((q) => q.question && q.correctAnswer && Array.isArray(q.options) && q.options.length >= 2);
      };

      const saveResult = (rec) => {
        const cur = loadLS('results', []);
        const i = cur.findIndex((x) => x.sessionId === rec.sessionId);
        const next = i >= 0 ? cur.map((x, k) => (k === i ? { ...x, ...rec } : x)) : [rec, ...cur];
        saveLS('results', next);
        setResults(next);
      };

      const launchGame = (game, playerName, studentId) => {
        const qs = getGameQuestions(game);
        if (!qs.length) { alert('Permainan ini belum punya soal. Tambahkan soal di Bank Soal, lalu pilih di Langkah 3 pembuatan permainan.'); return; }
        const wrongs = (q) => q.options.filter((o) => o !== q.correctAnswer).slice(0, 3);
        const race = qs.map((q) => { const a = [q.question, q.correctAnswer, ...wrongs(q)]; a.id = q.id; return a; });
        const school = qs.slice(0, 15).map((q) => {
          const w = wrongs(q);
          const a = [q.subject || 'Umum', q.question, q.correctAnswer, w[0] ?? null, w[1] ?? null, w[2] ?? null, q.explanation || 'Pembahasan belum diisi guru.'];
          a.id = q.id; return a;
        });
        const modeName = MODE_KEY[game.mode] ? game.mode : 'Lari';
        window.SIPINTAR_LAUNCH = {
          mode: MODE_KEY[modeName], dist: game.distIdx ?? 1, player: playerName, race, school,
          newSession: () => 'ses-' + Date.now() + '-' + Math.random().toString(36).slice(2, 6),
          report: (r) => saveResult({ ...r, gameId: game.id, gameTitle: game.title, className: game.className, mode: modeName, student: playerName, studentId: studentId || '', at: Date.now() }),
          exit: () => setPlay(null)
        };
        setLaunchModal(null);
        setPlay({ gameId: game.id });
      };

      const rosterFor = (g) => { const c = classes.find((x) => x.name === g.className); return c ? c.students : []; };
      const studentUrl = () => window.location.href.split('#')[0] + '#siswa';
      const gameResults = (gid) => results.filter((r) => r.gameId === gid).map(enrichResult);

      const [hostUrl, setHostUrl] = useState(() => loadLS('hostUrl', ''));

      const [remote, setRemote] = useState(null);      // sisi siswa

        if (selectedLiveGame && selectedLiveGame.id === game.id) setSelectedLiveGame(g2);

        const wrongs = (q) => q.options.filter((o) => o !== q.correctAnswer).slice(0, 3);
        return {
          race: qs.map((q) => ({ id: q.id, a: [q.question, q.correctAnswer, ...wrongs(q)] })),
          school: qs.slice(0, 15).map((q) => {
            const w = wrongs(q);
            return { id: q.id, a: [q.subject || 'Umum', q.question, q.correctAnswer, w[0] ?? null, w[1] ?? null, w[2] ?? null, q.explanation || 'Pembahasan belum diisi guru.'] };

      const openRoom = (game0) => {

        const data = buildData(game);

        closeRoom();
        const peer = new window.Peer(game.roomId);
        const R = { peer, conns: {}, cos: {}, ready: [], started: false, startList: null, game, data };
        const playersList = () => {
          const names = Object.keys(R.conns);
          const rd = R.ready.filter((n) => names.includes(n));
          const rest = names.filter((n) => !R.ready.includes(n));
          return [...rd, ...rest].map((n) => ({ name: n, cos: R.cos[n] || null, ready: R.ready.includes(n) }));
        };
        R.playersList = playersList;
        const broadcastPlayers = () => { const list = playersList(); Object.values(R.conns).forEach((c) => { try { if (c.open) c.send({ t: 'players', list }); } catch (e) {} });
          const SP = window.SIPINTAR_LAUNCH; if (SP && SP.spectator) { SP.players = list; if (SP.onPlayers) SP.onPlayers(list); } };
        roomRef.current = R;
        setRoom({ gameId: game.id, roomId: game.roomId, status: 'connecting', started: false });
        peer.on('open', () => setRoom((r) => r && { ...r, status: 'open' }));
        peer.on('disconnected', () => { try { peer.reconnect(); } catch (e) {} });
        peer.on('error', (e) => setRoom((r) => r && { ...r, status: 'error', err: e.type }));
        peer.on('connection', (conn) => {
          conn.on('open', () => {
            conn.send({
              t: 'hello', started: R.started, race: data.race, school: data.school,
              game: { id: game.id, title: game.title, mode: game.mode, distIdx: game.distIdx ?? 1, coverEmoji: game.coverEmoji, className: game.className },
              roster: rosterFor(game).map((s) => ({ id: s.id, name: s.name }))
            });
          });
          conn.on('data', (m) => {
            if (!m || !m.t) return;
            if (m.t === 'join' && m.name) {
              conn.studentName = m.name; R.conns[m.name] = conn;
              setLobby((l) => ({ ...l, [m.name]: { state: R.started ? 'bermain' : 'menunggu', id: m.id, ready: R.ready.includes(m.name) } }));
              if (R.started) conn.send({ t: 'start', players: R.startList }); else broadcastPlayers();
            }
            if (m.t === 'ready' && conn.studentName) {
              const nm = conn.studentName;
              if (!R.ready.includes(nm)) R.ready.push(nm);
              setLobby((l) => ({ ...l, [nm]: { ...(l[nm] || {}), ready: true, state: (l[nm] && l[nm].state) || 'menunggu' } }));
              if (!R.started) broadcastPlayers();
            }
            if (m.t === 'cos' && conn.studentName) { R.cos[conn.studentName] = m.cos; if (!R.started) broadcastPlayers(); }
            if (m.t === 'pos' && conn.studentName) {
              const out = { ...m, name: conn.studentName };
              const SP = window.SIPINTAR_LAUNCH; if (SP && SP.spectator && SP.onPos) SP.onPos(out);
              Object.values(R.conns).forEach((c) => { if (c !== conn && c.open) { try { c.send(out); } catch (e) {} } });
            }
            if (m.t === 'report' && m.rec && m.rec.sessionId) {
              saveResult(m.rec);
              setLobby((l) => ({ ...l, [m.rec.student]: { ...(l[m.rec.student] || {}), state: m.rec.done ? 'selesai' : 'bermain' } }));
            }
          });
          conn.on('close', () => {
            const nm = conn.studentName;
            if (nm && !R.started && R.conns[nm] === conn) { delete R.conns[nm]; delete R.cos[nm]; broadcastPlayers(); }
            if (nm) setLobby((l) => (l[nm] && l[nm].state !== 'selesai' ? { ...l, [nm]: { ...l[nm], state: 'terputus' } } : l));
          });
        });
      };

        setRemote({ status: 'connecting' });

        const peer = new window.Peer();
        const connect = () => {
          const conn = peer.connect(roomParam, { serialization: 'json', reliable: true });
          connRef.current = conn;
          conn.on('data', (m) => {
            if (!m) return;
            if (m.t === 'hello') setRemote((r) => ({ ...(r || {}), status: 'ready', hello: m, link: 'ok', started: !!m.started || !!(r && r.started) }));
            const L = window.SIPINTAR_LAUNCH;
            if (m.t === 'start') {
              startRef.current = m.players || null;
              setRemote((r) => ({ ...(r || {}), started: true }));
              if (L && L.remote) { L.started = true; L.players = m.players || L.players; if (L.onStart) L.onStart(m.players); }
            }
            if (m.t === 'players') { playersRef.current = m.list; if (L && L.remote) { L.players = m.list; if (L.onPlayers) L.onPlayers(m.list); } }
            if (m.t === 'pos') { if (L && L.remote && L.onPos) L.onPos(m); }
          });
          conn.on('open', () => {
            setRemote((r) => (r && r.hello ? { ...r, link: 'ok' } : r));
            if (joinedRef.current) conn.send({ t: 'join', ...joinedRef.current });
            if (joinedRef.current && lastCosRef.current) conn.send({ t: 'cos', cos: lastCosRef.current });
            Object.values(pendingRef.current).forEach((rec) => conn.send({ t: 'report', rec }));
            pendingRef.current = {};
          });
          conn.on('close', () => {
            if (closed) return;
            setRemote((r) => ({ ...(r || {}), link: 'lost' }));
            setTimeout(() => { if (!closed && !peer.destroyed) connect(); }, 2500);
          });
        };
        peer.on('open', connect);
        peer.on('error', (e) => setRemote((r) => (r && r.hello
          ? { ...r, link: 'lost' }
          : { status: 'error', msg: 'Belum bisa terhubung ke guru (' + e.type + '). Pastikan guru sudah menekan "Buka Ruang Kelas", lalu coba lagi.' })));

                      <label className="block text-xs font-bold uppercase text-slate-600 mb-1.5">Sistem Penilaian</label>
                      <select value={newGameForm.scoringSystem} onChange={(e) => setNewGameForm({ ...newGameForm, scoringSystem: e.target.value })} className="w-full px-4 py-3 rounded-2xl border border-slate-300 text-sm font-bold">

                      <span className="font-bold text-sm">Tampilkan Papan Peringkat ke Siswa</span>
                      <span className="font-extrabold text-blue-600">{newGameForm.showLeaderboardToStudents ? 'TAMPIL' : 'SEMBUNYI'}</span>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {wizardStep === 5 && (
              <div className="bg-white p-6 md:p-8 rounded-3xl border border-slate-200/80 shadow-sm space-y-6 text-center">
                <div className="w-16 h-16 rounded-3xl bg-amber-100 text-amber-600 flex items-center justify-center text-4xl mx-auto">
                  {newGameForm.coverEmoji}
                </div>
                <h2 className="text-2xl font-extrabold text-slate-800">{newGameForm.title}</h2>
                <p className="text-sm text-slate-500">
                  {newGameForm.className} • Mata Pelajaran: <strong>{newGameForm.subject}</strong> • Mode {newGameForm.mode}

                <div className="max-w-xl mx-auto bg-blue-50 p-6 rounded-3xl border-2 border-blue-200 space-y-4">

                    </div>
                  </div>

                <div className="flex justify-center gap-4">

                  <button type="button" onClick={() => { handlePublishGame(false); setActiveTab('monitoring'); }} className="px-8 py-3 rounded-2xl bg-blue-600 text-white font-extrabold text-sm shadow-lg cursor-pointer">

                  </button>
                </div>

            <div className="flex items-center justify-between bg-white p-4 rounded-2xl border border-slate-200/80">

                ← Sebelumnya
              </button>
              {wizardStep < 5 && (
                <button type="button" onClick={() => setWizardStep((p) => Math.min(5, p + 1))} className="px-6 py-2.5 rounded-xl bg-blue-600 text-white font-bold text-sm cursor-pointer">
                  Selanjutnya →
                </button>
              )}
            </div>

            {/* Menu Kelola & Hapus Permainan yang Sudah Dibuat / Dijalankan */}
            <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-4">
              <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-2 border-b border-slate-100 pb-3">

                  ))}

      };

      // ==========================================
      // 4. RENDER BANK SOAL
      // ==========================================
      const renderBankSoal = () => {
        const filteredQuestions = questions.filter((q) => {
          const matchSearch =
            q.question.toLowerCase().includes(bankSearch.toLowerCase()) ||
            q.topic.toLowerCase().includes(bankSearch.toLowerCase()) ||
            q.indicator.toLowerCase().includes(bankSearch.toLowerCase());
          const matchSubj = bankFilterSubject === 'Semua' || q.subject.toLowerCase().includes(bankFilterSubject.toLowerCase());
          const matchDiff = bankFilterDifficulty === 'Semua' || q.difficulty === bankFilterDifficulty;
          const matchType = bankFilterType === 'Semua' || q.type === bankFilterType;
          return matchSearch && matchSubj && matchDiff && matchType;
        });

        const toggleSelectQuestion = (id) => {
          setSelectedBankIds((prev) =>
            prev.includes(id) ? prev.filter((item) => item !== id) : [...prev, id]
          );
        };

        return (
          <div className="space-y-6">
            <div className="flex flex-col sm:flex-row sm:items-center justify-between gap-4 bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm">
              <div>
                <span className="text-xs font-bold uppercase tracking-wider text-purple-700 bg-purple-100 px-3 py-1 rounded-full">
                  Repositori Asesmen Terstandar
                </span>
                <h1 className="text-2xl font-extrabold text-slate-800 mt-2">Bank Soal SIPINTAR</h1>
                <p className="text-sm text-slate-500">
                  Kelola soal Pilihan Ganda (Opsi A s.d. E) lengkap dengan mata pelajaran fleksibel, indikator, dan pembahasan.
                </p>
              </div>
              <div className="flex items-center gap-2.5">
                {selectedBankIds.length > 0 && (
                  <button
                    onClick={() => {
                      setNewGameForm((prev) => ({ ...prev, selectedQuestionIds: selectedBankIds }));
                      setWizardStep(3);
                      setActiveTab('buat-permainan');
                      showToast(`${selectedBankIds.length} soal dimasukkan ke Wizard Buat Permainan!`);
                    }}
                    className="bg-amber-400 text-slate-900 font-bold px-4 py-3 rounded-2xl text-sm cursor-pointer"
                  >
                    Gunakan {selectedBankIds.length} Soal ke Permainan
                  </button>
                )}
                <button
                  onClick={() => {
                    setQuestionEditor({
                      id: null,
                      question: '',
                      type: 'Pilihan Ganda',
                      subject: 'Matematika',
                      topic: 'Pecahan',
                      indicator: 'Menyelesaikan masalah pecahan dalam kehidupan sehari-hari',
                      difficulty: 'Sedang',
                      score: 100,
                      timeLimit: 45,
                      options: ['Pilihan A', 'Pilihan B', 'Pilihan C', 'Pilihan D', 'Pilihan E'],
                      correctAnswer: 'Pilihan A',
                      explanation: '',
                      mediaType: 'Tanpa Media'
                    });
                    setActiveTab('buat-soal');
                  }}
                  className="bg-blue-600 hover:bg-blue-700 text-white font-bold px-5 py-3 rounded-2xl text-sm cursor-pointer"
                >
                  + Tambah Soal Baru
                </button>
              </div>
            </div>

            <div className="bg-white p-5 rounded-3xl border border-slate-200/80 shadow-sm grid grid-cols-1 md:grid-cols-4 gap-3">
              <input
                type="text"
                placeholder="Cari kata kunci soal atau materi..."
                value={bankSearch}
                onChange={(e) => setBankSearch(e.target.value)}
                className="px-4 py-2.5 rounded-xl border border-slate-300 text-sm"
              />
              <input
                type="text"
                placeholder="Filter Mata Pelajaran (Ketik manual)..."
                value={bankFilterSubject === 'Semua' ? '' : bankFilterSubject}
                onChange={(e) => setBankFilterSubject(e.target.value.trim() === '' ? 'Semua' : e.target.value)}
                className="px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold"
              />
              <select
                value={bankFilterDifficulty}
                onChange={(e) => setBankFilterDifficulty(e.target.value)}
                className="px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold"
              >
                <option value="Semua">Semua Tingkat Kesulitan</option>
                <option value="Mudah">Mudah</option>
                <option value="Sedang">Sedang</option>
                <option value="Sulit">Sulit</option>
              </select>
              <select
                value={bankFilterType}
                onChange={(e) => setBankFilterType(e.target.value)}
                className="px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold"
              >
                <option value="Semua">Jenis Soal: Pilihan Ganda</option>
                {QUESTION_TYPES.map((t) => <option key={t} value={t}>{t}</option>)}
              </select>
            </div>

            <div className="space-y-4">
              {filteredQuestions.map((q) => {
                const isSelected = selectedBankIds.includes(q.id);
                return (
                  <div key={q.id} className={`bg-white p-6 rounded-3xl border shadow-sm ${isSelected ? 'border-blue-600 ring-2 ring-blue-100' : 'border-slate-200/80'}`}>
                    <div className="flex flex-col md:flex-row md:items-center justify-between gap-3 pb-4 border-b border-slate-100">
                      <div className="flex flex-wrap items-center gap-2">
                        <input type="checkbox" checked={isSelected} onChange={() => toggleSelectQuestion(q.id)} className="w-4 h-4 cursor-pointer" />
                        <span className="px-3 py-1 rounded-full bg-blue-50 text-blue-700 font-bold text-xs">{q.subject} • {q.topic}</span>
                        <span className="px-3 py-1 rounded-full bg-purple-50 text-purple-700 font-bold text-xs">{q.type}</span>
                        <span className="px-3 py-1 rounded-full bg-amber-100 text-amber-800 font-bold text-xs">{q.difficulty}</span>
                        <span className="text-xs font-bold text-slate-500">🏆 {q.score} Poin • ⏱ {q.timeLimit} dtk</span>
                      </div>
                      <div className="flex items-center gap-2">
                        <button
                          onClick={() => { setQuestionEditor({ ...q, mediaType: q.mediaType || 'Ilustrasi 3D' }); setActiveTab('buat-soal'); }}
                          className="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-blue-50 text-slate-700 text-xs font-bold cursor-pointer"
                        >
                          ✏️ Edit
                        </button>
                        <button
                          onClick={() => {
                            setQuestions((prev) => [{ ...q, id: `q-${Date.now()}`, question: `${q.question} (Salinan)` }, ...prev]);
                            showToast('Soal berhasil diduplikasi!');
                          }}
                          className="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-emerald-50 text-slate-700 text-xs font-bold cursor-pointer"
                        >
                          📋 Duplikasi
                        </button>
                        <button
                          onClick={() => {
                            setQuestions((prev) => prev.filter((item) => item.id !== q.id));
                            showToast('Soal dihapus dari Bank Soal.');
                          }}
                          className="px-3 py-1.5 rounded-xl bg-slate-100 hover:bg-rose-50 text-rose-600 text-xs font-bold cursor-pointer"
                        >
                          🗑️ Hapus
                        </button>
                      </div>
                    </div>

                    <div className="mt-4 space-y-3">
                      <div className="text-xs text-slate-500 bg-slate-50 px-3.5 py-2 rounded-xl">
                        <strong>Indikator Asesmen:</strong> {q.indicator}
                      </div>
                      <p className="text-base font-bold text-slate-800">{q.question}</p>
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
                        {q.options.map((opt, i) => (
                          <div key={i} className={`p-3 rounded-xl border text-xs font-semibold flex justify-between ${opt === q.correctAnswer ? 'bg-emerald-50 border-emerald-300 text-emerald-900' : 'bg-slate-50 border-slate-200 text-slate-600'}`}>
                            <span>{String.fromCharCode(65 + i)}. {opt}</span>
                            {opt === q.correctAnswer && <span className="font-extrabold text-emerald-700">✓ Kunci</span>}
                          </div>
                        ))}
                      </div>
                      <div className="p-3.5 rounded-2xl bg-amber-50/70 border border-amber-200 text-xs text-amber-900">
                        <strong>💡 Pembahasan: </strong> {q.explanation}
                      </div>
                    </div>
                  </div>
                );
              })}
            </div>
          </div>
        );
      };

      // ==========================================
      // 5. RENDER BUAT SOAL (PILIHAN GANDA OPSI A-E)
      // ==========================================
      const renderBuatSoal = () => {
        const handleOptionChange = (index, val) => {
          const updated = [...questionEditor.options];
          const oldVal = updated[index];
          updated[index] = val;
          setQuestionEditor({
            ...questionEditor,
            options: updated,
            correctAnswer: questionEditor.correctAnswer === oldVal ? val : questionEditor.correctAnswer
          });
        };

        const handleAddOptionE = () => {
          if (questionEditor.options.length >= 5) return;
          setQuestionEditor({
            ...questionEditor,
            options: [...questionEditor.options, `Pilihan ${String.fromCharCode(65 + questionEditor.options.length)}`]
          });
        };

        const handleRemoveOption = (idx) => {
          if (questionEditor.options.length <= 2) {
            showToast('Minimal harus terdapat 2 opsi jawaban!');
            return;
          }
          const updated = questionEditor.options.filter((_, i) => i !== idx);
          setQuestionEditor({
            ...questionEditor,
            options: updated,
            correctAnswer: updated.includes(questionEditor.correctAnswer) ? questionEditor.correctAnswer : updated[0]
          });
        };

        return (
          <div className="space-y-6">
            <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm">
              <span className="text-xs font-bold uppercase tracking-wider text-blue-600 bg-blue-50 px-3 py-1 rounded-full">
                Studio Penyusunan Asesmen Interaktif
              </span>
              <h1 className="text-2xl font-extrabold text-slate-800 mt-2">
                {questionEditor.id ? 'Edit Soal Asesmen' : 'Buat Soal Baru'}
              </h1>
              <p className="text-sm text-slate-500">
                Ketik mata pelajaran secara manual, susun opsi Pilihan Ganda hingga E, dan lihat pratinjau layar siswa secara langsung.
              </p>
            </div>

            <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
              <form onSubmit={handleSaveQuestion} className="lg:col-span-7 bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-5">
                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-600 mb-1.5">Jenis Soal</label>
                    <input
                      type="text"
                      readOnly
                      value="Pilihan Ganda"
                      className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 bg-slate-100 text-slate-700 text-sm font-extrabold cursor-not-allowed"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-600 mb-1.5">Mata Pelajaran (Input Manual)</label>
                    <input
                      type="text"
                      required
                      placeholder="Ketik mata pelajaran (misal: Matematika, Produktif RPL, IPAS)..."
                      value={questionEditor.subject}
                      onChange={(e) => setQuestionEditor({ ...questionEditor, subject: e.target.value })}
                      className="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm font-bold focus:ring-2 focus:ring-blue-500 focus:outline-none"
                    />
                  </div>
                </div>

                <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                  <div>
                    <label className="block text-xs font-bold uppercase text-slate-600 mb-1.5">Materi / Topik</label>

      // ==========================================
      // 6. RENDER MONITORING PERMAINAN (REAL-TIME)
      // ==========================================
      const itemStats = (rows, qList) => qList.map((q) => {
        let n = 0, ok = 0;
        rows.forEach((r) => (r.log || []).forEach((l) => { if (l.id === q.id) { n++; if (l.ok) ok++; } }));
        return { q, n, pct: n ? Math.round((ok / n) * 100) : null };
      });

      const renderMonitoring = () => {
        const g = selectedLiveGame;
        const hasGame = g && g.id && g.id !== 'gm-empty';
        const rows = (hasGame ? gameResults(g.id) : []).sort((a, b) => b.totalScore - a.totalScore);
        const items = hasGame ? itemStats(rows, getGameQuestions(g)) : [];
        const playing = rows.filter((r) => !r.done).length;
        return (
          <div className="space-y-6">
            <div className="bg-gradient-to-r from-slate-900 via-blue-950 to-indigo-950 text-white p-6 md:p-7 rounded-3xl shadow-xl space-y-4">
              <div className="flex flex-wrap items-center gap-2.5">
                <span className="px-3.5 py-1 rounded-full text-xs font-extrabold uppercase bg-emerald-500 text-slate-950">● Kendali Permainan</span>
                <span className="text-xs font-bold px-3 py-1 rounded-full bg-white/10 text-blue-200">Kode PIN: {g.code}</span>

              </div>
              <h1 className="text-2xl md:text-3xl font-black">{g.coverEmoji} {g.title}</h1>
              <p className="text-sm text-blue-200">Kelas: <strong>{g.className}</strong> • Mapel: <strong>{g.subject}</strong> • Soal dari dasbor: <strong>{hasGame ? getGameQuestions(g).length : 0}</strong></p>
              <div className="flex flex-wrap gap-2 items-center">
                <select value={g.id || ''} onChange={(e) => { const f = games.find((x) => x.id === e.target.value); if (f) setSelectedLiveGame(f); }}
                  className="px-3 py-2.5 rounded-xl bg-white text-slate-900 font-bold text-xs">
                  {games.map((x) => <option key={x.id} value={x.id}>{x.coverEmoji} {x.title}</option>)}
                </select>
                {hasGame && (
                  <>
                    <button onClick={() => { setLaunchName(''); setLaunchModal(g); }} className="px-4 py-2.5 rounded-xl bg-amber-400 text-slate-950 font-extrabold text-xs cursor-pointer">▶ Mainkan di Layar Ini</button>
                    <button onClick={() => window.open(studentUrl(), '_blank')} className="px-4 py-2.5 rounded-xl bg-blue-600 text-white font-bold text-xs cursor-pointer">🧑‍🎓 Halaman Siswa (1 perangkat)</button>
                    <button onClick={() => { if (confirm('Hapus semua hasil permainan ini?')) { const next = loadLS('results', []).filter((r) => r.gameId !== g.id); saveLS('results', next); setResults(next); showToast('Hasil permainan dikosongkan.'); } }} className="px-4 py-2.5 rounded-xl bg-white/10 text-white font-bold text-xs cursor-pointer">🗑️ Kosongkan Hasil</button>
                    <button onClick={() => handleDeleteGame(g.id, g.title)} className="px-4 py-2.5 rounded-xl bg-rose-600 text-white font-bold text-xs cursor-pointer">Hapus Permainan</button>
                  </>
                )}

              <p className="text-[11px] text-blue-300">Siswa dapat bermain di halaman siswa (browser/tab yang sama dengan dasbor ini); hasilnya langsung muncul di tabel di bawah.</p>
            </div>

            <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-4">
              <h2 className="text-lg font-extrabold text-slate-800">📡 Ruang Kelas Bersama <span className="text-xs font-bold text-slate-400">(semua siswa kelas, dari perangkat masing-masing)</span></h2>
              {window.location.protocol === 'file:' && (
                <div className="space-y-1">
                  <label className="text-xs font-bold text-slate-600">Alamat web file ini setelah di-hosting</label>

                  <p className="text-[11px] text-slate-500">File ini dibuka dari komputer (file://), sehingga perangkat siswa tidak bisa mengaksesnya. Unggah file ini ke hosting gratis (mis. Netlify Drop atau GitHub Pages), buka dasbor dari alamat itu, atau tempel alamatnya di sini.</p>
                </div>
              )}
              {!room || room.gameId !== g.id ? (
                <div className="space-y-2">
                  {room && <p className="text-xs text-amber-700 font-bold">Ruang untuk permainan lain sedang terbuka; membuka ruang ini akan menutupnya.</p>}

                  <p className="text-[11px] text-slate-500">Biarkan tab dasbor ini tetap terbuka selama siswa bermain; dasbor ini yang menerima hasil mereka.</p>
                </div>
              ) : (
                <>
                  <div className="flex flex-wrap items-center gap-2">
                    <span className={`px-3 py-1 rounded-full text-xs font-extrabold ${room.status === 'open' ? 'bg-emerald-100 text-emerald-700' : room.status === 'error' ? 'bg-rose-100 text-rose-700' : 'bg-amber-100 text-amber-700'}`}>
                      {room.status === 'open' ? '● Ruang terbuka' : room.status === 'error' ? 'Gagal: ' + room.err : 'Menyambung…'}
                    </span>
                    <span className="text-xs font-bold text-slate-500">Masuk: {Object.keys(lobby).length} siswa</span>
                  </div>
                  <div className="bg-slate-50 rounded-2xl border border-slate-200 p-3 flex flex-col sm:flex-row sm:items-center gap-2 justify-between">
                    <span className="text-xs font-extrabold text-blue-700 break-all">{shareLink(room.roomId) || 'Isi alamat hosting di atas untuk mendapat link siswa.'}</span>
                    <div className="flex gap-2 shrink-0">
                      <button onClick={() => copyLinkText(shareLink(room.roomId))} className="px-3 py-2 rounded-xl bg-blue-600 text-white font-bold text-xs cursor-pointer">Salin Link</button>
                      <button onClick={() => shareWA(shareLink(room.roomId))} className="px-3 py-2 rounded-xl bg-emerald-600 text-white font-bold text-xs cursor-pointer">WhatsApp</button>
                    </div>
                  </div>
                  {(() => {
                    const rn = rosterFor(g).map((s) => s.name);
                    const names = [...rn, ...Object.keys(lobby).filter((n) => !rn.includes(n))];
                    const col = { siap: 'bg-emerald-100 text-emerald-700', menunggu: 'bg-amber-100 text-amber-700', bermain: 'bg-blue-100 text-blue-700', selesai: 'bg-emerald-100 text-emerald-700', terputus: 'bg-rose-100 text-rose-700' };
                    return (
                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2 max-h-72 overflow-auto">

                              <span className={`text-[11px] font-extrabold px-2 py-0.5 rounded-full ${col[st] || 'bg-slate-100 text-slate-500'}`}>{st}</span>

                      </div>

                  <div className="flex flex-wrap gap-2">
                    <button onClick={startAll} disabled={room.status !== 'open'} className="px-5 py-3 rounded-2xl bg-amber-400 text-slate-950 font-extrabold text-sm cursor-pointer disabled:opacity-50">{room.started ? '▶ Kirim Mulai ke Siswa yang Baru Masuk' : '▶ Mulai untuk Semua Siswa'}</button>
                    {g.mode !== 'Sekolah' && <button onClick={openSpectator} disabled={room.status !== 'open'} className="px-5 py-3 rounded-2xl bg-indigo-600 text-white font-extrabold text-sm cursor-pointer disabled:opacity-50">🎥 Layar Guru (pantau semua pelari)</button>}

                  </div>
                  <p className="text-[11px] text-slate-500">Siswa membuka link, memilih namanya dari daftar kelas {g.className}, lalu langsung masuk ke permainan (memilih kostum dan menunggu di garis start). Susunan start: 10 pelari per baris sesuai urutan siapa yang lebih cepat menekan Tutup Menu (maksimal 50 pelari, 5 baris). Hitung mundur berjalan serentak saat kamu menekan tombol mulai; peserta lomba hanya siswa yang sudah masuk. Siswa yang masuk terlambat langsung ikut mulai.</p>
                </>
              )}
            </div>

            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
              {[['Percobaan', rows.length, 'text-blue-600'], ['Sedang Bermain', playing, 'text-amber-600'],
                ['Rata-rata Akademik', avg(rows.map((r) => r.academic)), 'text-emerald-600'], ['Selesai', rows.length - playing, 'text-indigo-600']].map(([lb, v, c]) => (
                <div key={lb} className="bg-white p-5 rounded-2xl border border-slate-200/80">
                  <span className="text-xs font-bold uppercase text-slate-400">{lb}</span>
                  <div className={`text-3xl font-black mt-1 ${c}`}>{v}</div>
                </div>
              ))}
            </div>

            <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm overflow-x-auto">
              <h2 className="text-lg font-extrabold text-slate-800 mb-3">🏆 Papan Hasil Langsung</h2>
              {rows.length === 0 ? (
                <p className="text-sm text-slate-500">Belum ada siswa yang bermain. Tekan <b>Mainkan di Layar Ini</b> atau buka halaman siswa.</p>
              ) : (
                <table className="w-full text-sm">
                  <thead><tr className="text-left text-xs uppercase text-slate-400">
                    <th className="py-2">#</th><th>Siswa</th><th>Status</th><th>Progres</th><th>Benar</th><th>Salah</th><th>Akademik</th><th>Bonus</th><th>Total</th><th>Waktu</th>
                  </tr></thead>
                  <tbody>
                    {rows.map((r, i) => (
                      <tr key={r.sessionId} className="border-t border-slate-100">
                        <td className="py-2 font-black">{i + 1}</td>
                        <td className="font-bold">{r.student}</td>
                        <td>{r.done ? <span className="text-emerald-600 font-bold">Selesai</span> : <span className="text-amber-600 font-bold">Bermain…</span>}</td>
                        <td><div className="w-24 h-2 bg-slate-100 rounded-full"><div className="h-2 bg-blue-500 rounded-full" style={{ width: (r.progress || 0) + '%' }} /></div></td>
                        <td className="text-emerald-600 font-bold">{r.correct}</td>
                        <td className="text-rose-600 font-bold">{r.wrong}</td>
                        <td className="font-bold">{r.academic}</td>
                        <td>{r.bonus}</td>
                        <td className="font-black text-blue-700">{r.totalScore}</td>
                        <td>{fmtTime(r.timeSec)}</td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              )}
            </div>

            <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm">

              {items.map(({ q, n, pct }) => (
                <div key={q.id} className="py-2 border-t border-slate-100 flex items-center gap-3">
                  <div className="flex-1 text-sm text-slate-700">{q.question}</div>
                  <div className="w-28 h-2 bg-slate-100 rounded-full"><div className={`h-2 rounded-full ${pct !== null && pct < 60 ? 'bg-rose-500' : 'bg-emerald-500'}`} style={{ width: (pct || 0) + '%' }} /></div>
                  <div className="w-24 text-right text-xs font-bold">{pct === null ? 'belum ada data' : pct + '% benar (' + n + ')'}</div>
                </div>
              ))}
            </div>
          </div>
        );
      };

      const renderHasilAsesmen = () => {
        const g = selectedLiveGame;
        const all = results.map(enrichResult);
        const rows = hasilScope === 'all' ? all : all.filter((r) => r.gameId === g.id);
        const finished = rows.filter((r) => r.done);
        const byStudent = {};
        rows.forEach((r) => { (byStudent[r.student] = byStudent[r.student] || []).push(r); });
        const students = Object.keys(byStudent).map((nm) => {
          const rs = byStudent[nm];
          return { nm, n: rs.length, best: Math.max(...rs.map((r) => r.academic)), mean: avg(rs.map((r) => r.academic)), bonus: rs.reduce((a, r) => a + r.bonus, 0) };
        }).sort((a, b) => b.best - a.best);
        const items = itemStats(rows, questions).filter((x) => x.n > 0).sort((a, b) => a.pct - b.pct);
        const totalAns = rows.reduce((a, r) => a + (r.correct + r.wrong), 0);
        const totalOk = rows.reduce((a, r) => a + r.correct, 0);

        const exportCSV = () => {
          const head = ['Siswa', 'Kelas', 'Permainan', 'Jenis', 'Benar', 'Salah', 'Nilai Akademik', 'Bonus', 'Total', 'Waktu', 'Status', 'Tanggal'];
          const lines = rows.map((r) => [r.student, r.className, r.gameTitle, r.mode, r.correct, r.wrong, r.academic, r.bonus, r.totalScore, fmtTime(r.timeSec), r.done ? 'Selesai' : 'Belum selesai', new Date(r.at).toLocaleString('id-ID')]
            .map((v) => '"' + String(v).replace(/"/g, '""') + '"').join(','));
          const blob = new Blob(['\ufeff' + [head.join(','), ...lines].join('\n')], { type: 'text/csv;charset=utf-8' });
          const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'hasil-sipintar.csv'; a.click();
        };

        return (
          <div className="space-y-6">
            <div className="flex flex-col lg:flex-row lg:items-center justify-between gap-4 bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm">
              <div>
                <span className="text-xs font-bold uppercase tracking-wider text-emerald-700 bg-emerald-100 px-3 py-1 rounded-full">Evaluasi & Diagnostik Kompetensi</span>
                <h1 className="text-2xl font-extrabold text-slate-800 mt-2">Laporan Hasil Asesmen & Analisis Kompetensi</h1>
                <p className="text-sm text-slate-500">Data berasal langsung dari permainan siswa. Nilai akademik dipisah dari bonus permainan.</p>
              </div>
              <div className="flex flex-wrap gap-2 items-center">
                <select value={hasilScope} onChange={(e) => setHasilScope(e.target.value)} className="px-3 py-2.5 rounded-xl bg-slate-100 font-bold text-xs">
                  <option value="game">Permainan: {g.title}</option>
                  <option value="all">Semua permainan</option>
                </select>
                <button onClick={exportCSV} className="px-4 py-2.5 rounded-xl bg-emerald-600 text-white font-bold text-xs cursor-pointer">📊 Ekspor CSV</button>
                <button onClick={() => window.print()} className="px-4 py-2.5 rounded-xl bg-slate-800 text-white font-bold text-xs cursor-pointer">🖨️ Cetak</button>
              </div>
            </div>

            <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
              {[['Rata-rata Akademik', avg(finished.map((r) => r.academic)) + ' / 100', 'text-blue-600'],
                ['Jawaban Benar', (totalAns ? Math.round((totalOk / totalAns) * 1000) / 10 : 0) + '%', 'text-emerald-600'],
                ['Waktu Rata-rata', fmtTime(avg(finished.map((r) => r.timeSec))), 'text-amber-600'],
                ['Jumlah Percobaan', rows.length, 'text-indigo-600']].map(([lb, v, c]) => (
                <div key={lb} className="bg-white p-5 rounded-2xl border border-slate-200/80">
                  <span className="text-xs font-bold uppercase text-slate-400">{lb}</span>
                  <div className={`text-3xl font-black mt-1 ${c}`}>{v}</div>
                </div>
              ))}
            </div>

            <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm overflow-x-auto">
              <h2 className="text-lg font-extrabold text-slate-800 mb-3">👩‍🎓 Rekap Per Siswa</h2>
              {students.length === 0 ? <p className="text-sm text-slate-500">Belum ada hasil.</p> : (
                <table className="w-full text-sm">
                  <thead><tr className="text-left text-xs uppercase text-slate-400"><th className="py-2">Siswa</th><th>Percobaan</th><th>Nilai Terbaik</th><th>Rata-rata</th><th>Total Bonus</th></tr></thead>
                  <tbody>{students.map((s) => (
                    <tr key={s.nm} className="border-t border-slate-100"><td className="py-2 font-bold">{s.nm}</td><td>{s.n}</td><td className="font-black text-blue-700">{s.best}</td><td>{s.mean}</td><td>{s.bonus}</td></tr>
                  ))}</tbody>
                </table>
              )}
            </div>

            <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm">
              <h2 className="text-lg font-extrabold text-slate-800 mb-1">🎯 Soal Tersulit (perlu dibahas ulang)</h2>
              <p className="text-xs text-slate-500 mb-3">Diurutkan dari persentase benar terendah.</p>
              {items.length === 0 ? <p className="text-sm text-slate-500">Belum ada data jawaban.</p> : items.map(({ q, n, pct }) => (
                <div key={q.id} className="py-2 border-t border-slate-100 flex items-center gap-3">
                  <div className="flex-1 text-sm text-slate-700">{q.question}</div>
                  <span className={`text-xs font-extrabold px-2.5 py-1 rounded-lg ${pct < 60 ? 'bg-rose-100 text-rose-700' : 'bg-emerald-100 text-emerald-700'}`}>{pct}% benar • {n} jawaban</span>
                </div>
              ))}
            </div>
          </div>
        );
      };

      const renderPengaturan = () => (
        <div className="space-y-6 max-w-4xl">
          <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm">
            <h1 className="text-2xl font-extrabold text-slate-800">Pengaturan Profil Guru & Sekolah</h1>
            <p className="text-sm text-slate-500">Kelola identitas pendidik, data sekolah (SD/SMP/SMA/SMK), serta preferensi notifikasi.</p>
          </div>

          <div className="bg-white p-6 rounded-3xl border border-slate-200/80 shadow-sm space-y-4">
            <div>
              <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Nama Lengkap & Gelar Guru</label>
              <input type="text" value={teacherProfile.name} onChange={(e) => setTeacherProfile({ ...teacherProfile, name: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold" />
            </div>
            <div>
              <label className="block text-xs font-bold uppercase text-slate-500 mb-1">NIP / NUPTK</label>
              <input type="text" value={teacherProfile.nip} onChange={(e) => setTeacherProfile({ ...teacherProfile, nip: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm" />
            </div>
            <div>
              <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Email Resmi</label>
              <input type="email" value={teacherProfile.email} onChange={(e) => setTeacherProfile({ ...teacherProfile, email: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm" />
            </div>
            <div>
              <label className="block text-xs font-bold uppercase text-slate-500 mb-1">Nama Satuan Pendidikan</label>
              <input type="text" value={teacherProfile.school} onChange={(e) => setTeacherProfile({ ...teacherProfile, school: e.target.value })} className="w-full px-4 py-2.5 rounded-xl border border-slate-300 text-sm font-semibold" />
            </div>
            <button onClick={() => showToast('Profil Andri Sodikin, SST. berhasil disimpan!')} className="px-6 py-3 rounded-2xl bg-blue-600 text-white font-bold text-sm cursor-pointer">
              Simpan Perubahan Pengaturan
            </button>
          </div>
        </div>
      );

      const overlay = play && (
        <div className="fixed inset-0 z-[200] bg-black">
          <iframe title="Permainan SIPINTAR" srcDoc={gameHtml} allow="autoplay; fullscreen" className="w-full h-full border-0" />
          {play.spectator ? (
            <div className="fixed top-2 left-2 z-[210] flex flex-wrap items-center gap-2 bg-black/70 text-white rounded-2xl px-3 py-2 text-xs font-bold">
              <span>Masuk {Object.keys(lobby).length} • Siap {Object.values(lobby).filter((x) => x.ready).length}</span>
              <button onClick={startAll} disabled={!room || room.started} className="px-3 py-1.5 rounded-xl bg-amber-400 text-slate-950 font-extrabold cursor-pointer disabled:opacity-50">▶ Mulai untuk Semua</button>
              <button onClick={closeSpectator} className="px-3 py-1.5 rounded-xl bg-white/15 cursor-pointer">✕ Tutup Layar Guru</button>
            </div>
          ) : (
            <button onClick={() => setPlay(null)} className="fixed bottom-1 left-1/2 -translate-x-1/2 z-[210] px-3 py-1 rounded-full bg-black/60 text-white text-[10px] font-bold cursor-pointer opacity-60 hover:opacity-100">✕ Keluar ke Dasbor</button>
          )}
        </div>
      );

      const launchUI = launchModal && (
        <div className="fixed inset-0 z-[150] bg-slate-900/70 flex items-center justify-center p-4">
          <div className="bg-white rounded-3xl p-6 w-full max-w-md space-y-4 shadow-2xl">
            <h3 className="text-lg font-extrabold text-slate-800">{launchModal.coverEmoji} {launchModal.title}</h3>
            <p className="text-xs text-slate-500">Jenis permainan: <b>{launchModal.mode}</b> • Kelas {launchModal.className}</p>
            <label className="text-xs font-bold text-slate-600">Nama siswa</label>
            <input list="roster-list" value={launchName} onChange={(e) => setLaunchName(e.target.value)} placeholder="Pilih atau ketik nama siswa" className="w-full px-4 py-3 rounded-xl border-2 border-slate-200 font-bold text-sm" />
            <datalist id="roster-list">{rosterFor(launchModal).map((s) => <option key={s.id} value={s.name} />)}</datalist>
            <div className="flex gap-2 justify-end">
              <button onClick={() => setLaunchModal(null)} className="px-4 py-2.5 rounded-xl bg-slate-100 font-bold text-sm cursor-pointer">Batal</button>
              <button onClick={() => { const nm = launchName.trim() || 'Siswa'; const st = rosterFor(launchModal).find((s) => s.name === nm); launchGame(launchModal, nm, st && st.id); }}
                className="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-extrabold text-sm cursor-pointer">▶ Mulai Bermain</button>
            </div>
          </div>
        </div>
      );

      const renderSiswa = () => {
        if (roomParam) {
          const h = remote && remote.hello;
          return (
            <div className="min-h-screen flex items-center justify-center p-4">
              <div className="bg-white rounded-3xl shadow-2xl border-4 border-indigo-100 p-6 md:p-8 w-full max-w-md space-y-4 text-center">
                <div className="text-5xl">{h ? h.game.coverEmoji : '🎮'}</div>
                <h1 className="text-2xl font-black text-blue-700">{h ? h.game.title : 'SIPINTAR'}</h1>
                {h && <p className="text-xs text-slate-500">Jenis permainan: <b>{h.game.mode}</b> • Kelas {h.game.className}</p>}
                {(!remote || remote.status === 'connecting') && <p className="text-sm text-slate-500">Menghubungkan ke ruang guru…</p>}
                {remote && remote.status === 'error' && (
                  <>
                    <p className="text-sm text-rose-600 font-bold">{remote.msg}</p>
                    <button onClick={() => window.location.reload()} className="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-bold text-sm cursor-pointer">🔄 Coba Lagi</button>
                  </>
                )}
                {h && !remote.joined && (
                  <div className="space-y-3 text-left">
                    <label className="text-xs font-bold text-slate-600">Pilih namamu</label>
                    <input list="roster-remote" value={remoteName} onChange={(e) => setRemoteName(e.target.value)} placeholder="Pilih dari daftar atau ketik namamu" className="w-full px-4 py-3 rounded-xl border-2 border-slate-200 font-bold text-sm" />
                    <datalist id="roster-remote">{(h.roster || []).map((s) => <option key={s.id} value={s.name} />)}</datalist>
                    <button onClick={joinRemote} className="w-full py-3 rounded-2xl bg-amber-400 text-slate-950 font-black text-sm cursor-pointer">✅ MASUK</button>
                  </div>
                )}
                {h && remote.joined && !remote.launched && !remote.started && <p className="text-sm font-bold text-slate-700">Kamu sudah masuk sebagai <b>{remote.name}</b>. Menunggu guru memulai permainan…</p>}
                {h && remote.joined && remote.launched && !play && (
                  <div className="space-y-3">
                    <p className="text-sm font-bold text-emerald-700">Kamu keluar dari permainan. Hasil yang sudah selesai terkirim ke guru. 🎉</p>
                    <button onClick={() => launchRemote(remote)} className="px-5 py-2.5 rounded-xl bg-blue-600 text-white font-bold text-sm cursor-pointer">▶ Kembali ke Permainan</button>
                  </div>
                )}
                {remote && remote.link === 'lost' && <p className="text-xs text-amber-600 font-bold">Koneksi ke guru terputus, mencoba menyambung lagi…</p>}
              </div>
            </div>
          );
        }
        const open = games.filter((x) => x.status !== 'Draft');
        const g = open.find((x) => x.id === siswaGameId) || open[0];
        return (
          <div className="min-h-screen flex items-center justify-center p-4">
            <div className="bg-white rounded-3xl shadow-2xl border-4 border-indigo-100 p-6 md:p-8 w-full max-w-md space-y-4">
              <div className="text-center">
                <div className="text-5xl">🎮</div>
                <h1 className="text-2xl font-black text-blue-700">SIPINTAR</h1>
                <p className="text-xs text-slate-500">Pilih permainan dari gurumu, lalu mulai!</p>
              </div>
              {!g ? <p className="text-sm text-slate-500 text-center">Belum ada permainan yang dibuat guru.</p> : (
                <>
                  <label className="text-xs font-bold text-slate-600">Permainan</label>
                  <select value={g.id} onChange={(e) => setSiswaGameId(e.target.value)} className="w-full px-4 py-3 rounded-xl border-2 border-slate-200 font-bold text-sm">
                    {open.map((x) => <option key={x.id} value={x.id}>{x.coverEmoji} {x.title} — {x.mode}</option>)}
                  </select>
                  <label className="text-xs font-bold text-slate-600">Nama kamu</label>
                  <input list="roster-siswa" value={launchName} onChange={(e) => setLaunchName(e.target.value)} placeholder="Pilih atau ketik namamu" className="w-full px-4 py-3 rounded-xl border-2 border-slate-200 font-bold text-sm" />
                  <datalist id="roster-siswa">{rosterFor(g).map((s) => <option key={s.id} value={s.name} />)}</datalist>
                  <button onClick={() => { const nm = launchName.trim() || 'Siswa'; const st = rosterFor(g).find((s) => s.name === nm); launchGame(g, nm, st && st.id); }}
                    className="w-full py-3 rounded-2xl bg-amber-400 text-slate-950 font-black text-sm cursor-pointer">🚀 MAIN SEKARANG</button>
                </>
              )}
              <button onClick={() => { window.location.hash = ''; }} className="block mx-auto text-xs text-slate-500 underline cursor-pointer">← Ke Dasbor Guru</button>
            </div>
          </div>
        );
      };

      return (
        <>
        {overlay}
        {launchUI}
        {siswaMode ? renderSiswa() : (
        <div className="min-h-screen bg-slate-50 text-slate-800 flex flex-col md:flex-row">
          {toast && (
            <div className="fixed bottom-5 right-5 z-50 bg-slate-900 text-white px-5 py-3.5 rounded-2xl shadow-2xl flex items-center gap-3">
              <span>✨</span>
              <span className="text-xs md:text-sm font-bold">{toast.message}</span>
            </div>
          )}

          {studentJoinSimModal && (
            <div className="fixed inset-0 z-50 bg-slate-950/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-gradient-to-b from-blue-700 to-slate-900 text-white rounded-3xl max-w-md w-full p-6 text-center space-y-4">
                <div className="flex justify-between items-center">
                  <span className="text-xs font-extrabold uppercase px-3 py-1 rounded-full bg-amber-400 text-slate-950">Simulasi Layar Siswa</span>
                  <button onClick={() => setStudentJoinSimModal(null)} className="text-white font-bold cursor-pointer">✕</button>
                </div>
                <div className="text-5xl">{studentJoinSimModal.coverEmoji}</div>
                <h3 className="text-xl font-black">{studentJoinSimModal.title}</h3>
                <p className="text-xs text-blue-200">Siswa langsung masuk ke permainan tanpa login rumit</p>
                <input type="text" defaultValue="Dinda Kirana" className="w-full px-3.5 py-2.5 rounded-xl bg-white text-slate-900 font-bold text-sm" />
                <button
                  onClick={() => { setStudentJoinSimModal(null); setActiveTab('monitoring'); showToast('Siswa bergabung ke ruang Monitoring!'); }}
                  className="w-full py-3 rounded-2xl bg-amber-400 text-slate-950 font-black text-sm cursor-pointer"
                >
                  🚀 Masuk ke Permainan!
                </button>
              </div>
            </div>
          )}

          {/* SIDEBAR */}
          <aside className={`fixed md:static inset-y-0 left-0 z-40 w-72 bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-900 text-white border-r-4 border-indigo-500/40 flex flex-col justify-between transition-transform shadow-2xl ${mobileMenuOpen ? 'translate-x-0' : '-translate-x-full md:translate-x-0'}`}>
            <div>
              <div className="p-6 border-b border-indigo-800/60 flex items-center justify-between">
                <div className="flex items-center gap-3">
                  <div className="w-12 h-12 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-500 text-slate-950 border-2 border-yellow-200 shadow-lg flex items-center justify-center p-1.5 shrink-0">
                    <img src="https://i.imgur.com/vbpWkFn.png" alt="Logo SIPINTAR" className="w-full h-full object-contain" />
                  </div>
                  <div>
                    <div className="flex items-center gap-1.5">
                      <span className="text-xl font-black text-amber-400 tracking-wide drop-shadow">SIPINTAR</span>
                    </div>
                    <p className="text-[10px] font-semibold text-indigo-200 leading-snug mt-0.5">
                      Sistem Petualangan Interaktif untuk Penilaian dan Tantangan Asesmen Responsif
                    </p>
                  </div>
                </div>
                <button onClick={() => setMobileMenuOpen(false)} className="md:hidden text-indigo-200">✕</button>
              </div>

              <nav className="p-4 space-y-2">
                {navItems.map((item) => {
                  const active = activeTab === item.id;
                  return (
                    <button
                      key={item.id}
                      onClick={() => { setActiveTab(item.id); setMobileMenuOpen(false); }}
                      className={`w-full flex items-center justify-between px-4 py-3 rounded-2xl font-bold text-sm transition-all cursor-pointer ${
                        active
                          ? 'bg-amber-400 text-slate-950 shadow-lg'
                          : 'text-indigo-100 hover:bg-white/10 hover:text-amber-300'
                      }`}
                    >
                      <div className="flex items-center gap-3">
                        <Icon name={item.icon} className="w-5 h-5" />
                        <span>{item.label}</span>
                      </div>
                      {item.badge !== null && (
                        <span className={`text-[11px] font-extrabold px-2.5 py-0.5 rounded-full ${item.badgeColor || (active ? 'bg-slate-900 text-amber-300' : 'bg-indigo-800 text-indigo-200')}`}>
                          {item.badge}
                        </span>
                      )}
                    </button>
                  );
                })}
              </nav>
            </div>

            <div className="p-4 m-4 rounded-2xl bg-indigo-900/80 border-2 border-indigo-400/30 space-y-2">
              <div className="text-xs font-extrabold text-amber-300">⚔️ Guild Master Control</div>
              <p className="text-[11px] text-indigo-200">Mendukung jenjang SD, SMP, SMA, dan SMK dengan mata pelajaran fleksibel.</p>
            </div>
          </aside>

          {/* KONTEN UTAMA */}
          <div className="flex-1 flex flex-col min-w-0">
            <header className="sticky top-0 z-30 bg-white/95 backdrop-blur-md border-b-4 border-indigo-100 px-4 md:px-8 py-3.5 flex items-center justify-between gap-4 shadow-sm">
              <div className="flex items-center gap-3">
                <button onClick={() => setMobileMenuOpen(true)} className="md:hidden p-2 rounded-xl bg-slate-100">☰</button>
                <div className="flex items-center gap-2.5 bg-gradient-to-r from-indigo-50 to-blue-50 px-4 py-2 rounded-2xl border-2 border-blue-200">
                  <span className="text-xl">{activeClass.icon}</span>
                  <div>
                    <span className="text-[10px] font-extrabold uppercase text-blue-600 block leading-none">🏰 ARENA KELAS AKTIF</span>
                    <select
                      value={activeClassId}
                      onChange={(e) => setActiveClassId(e.target.value)}
                      className="bg-transparent font-extrabold text-xs md:text-sm text-slate-800 focus:outline-none cursor-pointer"
                    >
                      {classes.map((c) => <option key={c.id} value={c.id}>{c.name} ({c.grade})</option>)}
                    </select>
                  </div>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <div className="hidden lg:flex items-center gap-1.5 px-3.5 py-2 rounded-2xl bg-amber-50 border-2 border-amber-300 text-amber-800 font-extrabold text-xs">
                  <span>💎</span>
                  <span>2.450 XP Guru</span>
                </div>
                <div onClick={() => setActiveTab('pengaturan')} className="flex items-center gap-3 pl-2 pr-3 py-1.5 rounded-2xl bg-slate-50 border-2 border-slate-200 hover:border-blue-400 cursor-pointer">
                  <div className="w-10 h-10 rounded-2xl bg-gradient-to-br from-amber-400 to-orange-500 border-2 border-white shadow text-white flex items-center justify-center text-lg">👨🏻‍🏫</div>
                  <div className="hidden sm:block text-left">
                    <div className="text-xs md:text-sm font-extrabold text-slate-800">{teacherProfile.name}</div>
                    <div className="text-[11px] font-semibold text-indigo-600">⭐ Game Master • {teacherProfile.school}</div>
                  </div>
                </div>
                <button onClick={() => showToast('Sesi Anda aman dalam mode Pratinjau Dashboard Guru SIPINTAR.')} className="p-2.5 rounded-2xl bg-rose-50 border-2 border-rose-200 text-rose-600 cursor-pointer" title="Logout">
                  <Icon name="log-out" className="w-5 h-5" />
                </button>
              </div>
            </header>

            <main className="flex-1 p-4 md:p-8 max-w-7xl w-full mx-auto">
              {activeTab === 'beranda' && renderBeranda()}
              {activeTab === 'kelas' && renderKelasSaya()}
              {activeTab === 'buat-permainan' && renderBuatPermainan()}
              {activeTab === 'bank-soal' && renderBankSoal()}
              {activeTab === 'buat-soal' && renderBuatSoal()}
              {activeTab === 'monitoring' && renderMonitoring()}
              {activeTab === 'hasil-asesmen' && renderHasilAsesmen()}
              {activeTab === 'pengaturan' && renderPengaturan()}
            </main>

            <footer className="mt-auto border-t-4 border-indigo-100 bg-white/90 backdrop-blur-sm py-4 px-4 md:px-8 text-center">
              <p className="text-xs md:text-sm font-extrabold text-slate-700 tracking-wide">
                Pengembang : <span className="text-blue-700">Andri Sodikin</span>
              </p>
            </footer>
          </div>
        </div>
        )}
        </>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
